{{ define "master/siswa_form" }}
{{ template "components/modal_start" . }}
<form {{ if .Edit }}hx-put{{ else }}hx-post{{ end }}="{{ .Action }}" hx-target="#modal-root" hx-swap="innerHTML">
  {{ template "components/form_error" .Error }}

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">NIS</label>
      <input name="nis" value="{{ .Item.NIS }}" required placeholder="Nomor Induk Siswa"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
      <input name="nama" value="{{ .Item.Nama }}" required placeholder="Nama siswa"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none" />
    </div>
  </div>

  <div class="mb-4">
    <label class="block text-sm font-medium text-slate-700 mb-1">Kelas <span class="text-slate-400 font-normal">(opsional)</span></label>
    <select name="kelas_id"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none">
      <option value="">— Belum ditempatkan —</option>
      {{ $sel := derefID .Item.KelasID }}
      {{ range .KelasList }}
      <option value="{{ .ID }}" {{ if eq .ID $sel }}selected{{ end }}>{{ .Nama }} · {{ .TahunAjaran.Nama }}</option>
      {{ end }}
    </select>
  </div>

  <label class="flex items-center gap-2 text-sm text-slate-700">
    <input type="checkbox" name="aktif" {{ if .Item.Aktif }}checked{{ end }}
           class="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
    Siswa aktif
  </label>

  {{ template "components/form_footer" . }}
</form>
{{ template "components/modal_end" . }}
{{ end }}
