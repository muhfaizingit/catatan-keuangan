{{ define "master/donatur_form" }}
{{ template "components/modal_start" . }}
<form {{ if .Edit }}hx-put{{ else }}hx-post{{ end }}="{{ .Action }}" hx-target="#modal-root" hx-swap="innerHTML">
  {{ template "components/form_error" .Error }}

  <div class="mb-4">
    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Donatur</label>
    <input name="nama" value="{{ .Item.Nama }}" required placeholder="contoh: Yayasan Mentari"
           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none" />
  </div>

  <div class="mb-4">
    <label class="block text-sm font-medium text-slate-700 mb-1">Keterangan <span class="text-slate-400 font-normal">(opsional)</span></label>
    <textarea name="keterangan" rows="2" placeholder="Kontak / catatan"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none">{{ .Item.Keterangan }}</textarea>
  </div>

  <label class="flex items-center gap-2 text-sm text-slate-700">
    <input type="checkbox" name="aktif" {{ if .Item.Aktif }}checked{{ end }}
           class="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
    Aktif
  </label>

  {{ template "components/form_footer" . }}
</form>
{{ template "components/modal_end" . }}
{{ end }}
