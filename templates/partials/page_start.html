{{ define "partials/page_start" }}
<!doctype html>
<html lang="id" class="h-full bg-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ .Title }} · Keuangan Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',
              400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',
              800:'#1e40af',900:'#1e3a8a'
            }
          },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="h-full font-sans text-slate-700 antialiased">
  <div class="min-h-full lg:flex">
    {{ template "partials/sidebar" . }}
    <div class="flex-1 min-w-0 lg:pl-64">
      {{ template "partials/topbar" . }}
      <main class="px-4 py-6 sm:px-6 lg:px-8 max-w-7xl mx-auto">
{{ end }}
