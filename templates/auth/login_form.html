{{ define "auth/login_form" }}
<form hx-post="/login" hx-target="#login-form-wrap" hx-swap="innerHTML" class="space-y-4">
  {{ if .Error }}
  <div class="rounded-lg bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700">
    {{ .Error }}
  </div>
  {{ end }}

  <div>
    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required
           value="{{ .Email }}"
           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                  focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none"
           placeholder="nama@sekolah.test" />
  </div>

  <div>
    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required
           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                  focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none"
           placeholder="••••••••" />
  </div>

  <button type="submit"
          class="w-full rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white
                 hover:bg-primary-700 focus:ring-2 focus:ring-primary-300 transition">
    Masuk
  </button>
</form>
{{ end }}
