{{ define "laporan/filter" }}
<form method="get" action="{{ .Endpoint }}"
      class="hidden-print mb-5 rounded-xl border border-slate-200 bg-white p-4">
  <div class="flex flex-wrap items-end gap-3">
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Tahun Ajaran</label>
      <select name="ta" onchange="this.form.submit()"
              class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200">
        {{ $sel := .SelectedTA }}
        {{ range .TahunList }}<option value="{{ .ID }}" {{ if eq .ID $sel }}selected{{ end }}>{{ .Nama }}{{ if .Aktif }} (aktif){{ end }}</option>{{ end }}
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Kelas</label>
      <select name="kelas" onchange="this.form.submit()"
              class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200">
        <option value="0">Semua kelas</option>
        {{ $sk := .SelectedKelas }}
        {{ range .KelasList }}<option value="{{ .ID }}" {{ if eq .ID $sk }}selected{{ end }}>{{ .Nama }}</option>{{ end }}
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Bulan</label>
      <select name="bulan" onchange="this.form.submit()"
              class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200">
        <option value="0">Semua bulan</option>
        {{ $b := .Bulan }}
        {{ range seq 12 }}<option value="{{ . }}" {{ if eq . $b }}selected{{ end }}>{{ namaBulan . }}</option>{{ end }}
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Dari tanggal</label>
      <input type="date" name="dari" value="{{ .Dari }}"
             class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200" />
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Sampai tanggal</label>
      <input type="date" name="sampai" value="{{ .Sampai }}"
             class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200" />
    </div>
    <button type="submit"
            class="rounded-lg bg-primary-600 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-700">Terapkan</button>
    <a href="{{ .Endpoint }}"
       class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">Reset</a>
  </div>
  <p class="mt-2 text-[11px] text-slate-400">Isi rentang tanggal untuk mengabaikan filter bulan. Periode aktif: <span class="font-medium text-slate-600">{{ .Periode }}</span></p>
</form>
{{ end }}
