# Reverse proxy Apache untuk Keuangan Sekolah
# Letakkan di: /etc/apache2/sites-available/tk-aba19.oia.my.id.conf
# Aktifkan modul dulu:
#   sudo a2enmod proxy proxy_http headers rewrite
#
# Setelah file ini aktif, jalankan:
#   sudo certbot --apache -d tk-aba19.oia.my.id
# certbot akan menambahkan blok <VirtualHost *:443> + redirect 80->443 otomatis.

<VirtualHost *:80>
    ServerName tk-aba19.oia.my.id

    # Jangan akses port 8080 langsung dari publik (tutup di firewall).
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:8080/ connectiontimeout=60 timeout=60
    ProxyPassReverse / http://127.0.0.1:8080/

    # Izinkan upload form agak besar bila perlu (10 MB).
    LimitRequestBody 10485760

    # Header agar app tahu proto asli (http/https) — penting untuk cookie secure/redirect.
    # REQUEST_SCHEME otomatis "http" di sini, dan "https" di vhost 443 (hasil certbot).
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
</VirtualHost>
